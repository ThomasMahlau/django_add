{% extends "index.html" %}

{% block content %}
    <h1>Klientenliste</h1>
    <table class="table table-striped table-bordered table-hover">
        <thead>
            <tr><th>#</th>
                <th>Name, Vorname</th>
                <th>Strasse</th>
                <th>Ort</th>
                <th>bearbeiten</th>
            </tr>
        </thead>
        <tbody>
            {% for klient in klientinnen %}
            <tr>
                <td>{{ klient.id }}</td>
                <td>{{ klient.name }}, {{ klient.vorname }}</td>
                <td>{{ klient.strasse }}</td>
                <td>{{ klient.plz }} {{ klient.ort }}</td>
                <td>
                    <a href="/klienten/detail/{{klient.id}}" class="btn btn-outline-success">
                        Details
                    </a>
                    <a href="" class="btn btn-outline-danger">
                        bearbeiten
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock content %}
